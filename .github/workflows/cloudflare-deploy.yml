name: Deploy Cortex AI to Cloudflare Workers

concurrency:
  group: cortex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    environment: cortex1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Worker
        run: npx vinext build

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cddba2278fda0cf565b31f9280a7af1f
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing from cortex1 secrets/variables"; exit 1; }
          echo "Cloudflare API token is available; account ID is configured in workflow."

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cddba2278fda0cf565b31f9280a7af1f
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Sync Worker runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cddba2278fda0cf565b31f9280a7af1f
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL || vars.POSTGRES_PRISMA_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL || vars.POSTGRES_URL }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY || vars.APP_SECRET_KEY }}
          CORTEX_ADMIN_PASSWORD: ${{ secrets.CORTEX_ADMIN_PASSWORD || vars.CORTEX_ADMIN_PASSWORD }}
          CORTEX_ADMIN_USERNAME: ${{ secrets.CORTEX_ADMIN_USERNAME || vars.CORTEX_ADMIN_USERNAME }}
          TELEGRAM_INTERNAL_SECRET: ${{ secrets.TELEGRAM_INTERNAL_SECRET || vars.TELEGRAM_INTERNAL_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || vars.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || vars.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --name cortex-ai >/dev/null
              echo "Synced Worker secret: $name"
            else
              echo "Worker secret not supplied in cortex1: $name (skipped)"
            fi
          }
          put_secret DATABASE_URL "$DATABASE_URL"
          put_secret POSTGRES_PRISMA_URL "$POSTGRES_PRISMA_URL"
          put_secret POSTGRES_URL "$POSTGRES_URL"
          put_secret APP_SECRET_KEY "$APP_SECRET_KEY"
          put_secret CORTEX_ADMIN_PASSWORD "$CORTEX_ADMIN_PASSWORD"
          put_secret CORTEX_ADMIN_USERNAME "$CORTEX_ADMIN_USERNAME"
          put_secret TELEGRAM_INTERNAL_SECRET "$TELEGRAM_INTERNAL_SECRET"
          put_secret R2_ACCOUNT_ID "$R2_ACCOUNT_ID"
          put_secret R2_BUCKET_NAME "$R2_BUCKET_NAME"
          put_secret R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID"
          put_secret R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"
      - name: Ensure password crypto extension
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL || vars.POSTGRES_PRISMA_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL || vars.POSTGRES_URL }}
        run: |
          set -euo pipefail
          db_url="${DATABASE_URL:-${POSTGRES_PRISMA_URL:-${POSTGRES_URL:-}}}"
          test -n "$db_url" || { echo "Postgres URL missing"; exit 1; }
          printf '%s' 'CREATE EXTENSION IF NOT EXISTS pgcrypto;' | npx prisma db execute --url "$db_url" --stdin
          agent_api_key_sql='CREATE TABLE IF NOT EXISTS "AgentApiKey" ("id" TEXT PRIMARY KEY, "agentId" TEXT NOT NULL, "name" TEXT NOT NULL, "keyHash" TEXT NOT NULL UNIQUE, "keyPrefix" TEXT NOT NULL, "active" BOOLEAN NOT NULL DEFAULT TRUE, "lastUsedAt" TIMESTAMP(3), "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP, "updatedAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP, CONSTRAINT "AgentApiKey_agentId_fkey" FOREIGN KEY ("agentId") REFERENCES "Agent"("id") ON DELETE CASCADE ON UPDATE CASCADE); CREATE INDEX IF NOT EXISTS "AgentApiKey_agentId_active_idx" ON "AgentApiKey"("agentId","active");'
          printf '%s\n' "$agent_api_key_sql" | npx prisma db execute --url "$db_url" --stdin
          usage_reservation_sql='CREATE TABLE IF NOT EXISTS "UsageReservation" ("id" TEXT PRIMARY KEY, "workspaceId" TEXT NOT NULL, "telegramUserId" TEXT, "messages" INTEGER NOT NULL DEFAULT 0, "tokens" INTEGER NOT NULL DEFAULT 0, "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP, "expiresAt" TIMESTAMP(3) NOT NULL, CONSTRAINT "UsageReservation_workspaceId_fkey" FOREIGN KEY ("workspaceId") REFERENCES "Workspace"("id") ON DELETE CASCADE ON UPDATE CASCADE, CONSTRAINT "UsageReservation_telegramUserId_fkey" FOREIGN KEY ("telegramUserId") REFERENCES "TelegramUser"("id") ON DELETE CASCADE ON UPDATE CASCADE); CREATE INDEX IF NOT EXISTS "UsageReservation_workspaceId_createdAt_idx" ON "UsageReservation"("workspaceId","createdAt"); CREATE INDEX IF NOT EXISTS "UsageReservation_workspaceId_expiresAt_idx" ON "UsageReservation"("workspaceId","expiresAt"); CREATE INDEX IF NOT EXISTS "UsageReservation_expiresAt_idx" ON "UsageReservation"("expiresAt"); CREATE INDEX IF NOT EXISTS "UsageReservation_telegramUserId_createdAt_idx" ON "UsageReservation"("telegramUserId","createdAt"); CREATE INDEX IF NOT EXISTS "UsageReservation_telegramUserId_expiresAt_idx" ON "UsageReservation"("telegramUserId","expiresAt");'
          printf '%s\n' "$usage_reservation_sql" | npx prisma db execute --url "$db_url" --stdin
          echo "PostgreSQL pgcrypto, Agent API key storage, and usage reservation storage are ready."

      - name: Ensure required Worker database secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cddba2278fda0cf565b31f9280a7af1f
        run: |
          set -euo pipefail
          secrets="$(npx wrangler secret list --name cortex-ai 2>/dev/null || true)"
          if ! printf '%s' "$secrets" | grep -Eq 'DATABASE_URL|POSTGRES_PRISMA_URL|POSTGRES_URL'; then
            echo "Missing required Cloudflare Worker Postgres secret (DATABASE_URL/POSTGRES_PRISMA_URL/POSTGRES_URL)"
            echo "Add a Postgres connection secret to the cortex1 Environment or to the Worker, then rerun the deployment."
            exit 1
          fi
          if ! printf '%s' "$secrets" | grep -q 'APP_SECRET_KEY'; then
            echo "APP_SECRET_KEY not found; generating a persistent Worker secret."
            openssl rand -hex 32 | npx wrangler secret put APP_SECRET_KEY --name cortex-ai
          else
            echo "Worker APP_SECRET_KEY already exists."
          fi

      - name: Verify Worker runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cddba2278fda0cf565b31f9280a7af1f
        run: |
          npx wrangler secret list --name cortex-ai
          echo "Expected runtime secrets: Postgres + APP_SECRET_KEY; R2_ACCOUNT_ID/R2_BUCKET_NAME/R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY enable 200MB direct uploads; admin/Telegram secrets are optional."

      - name: Smoke test admin and public routes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL || vars.POSTGRES_PRISMA_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL || vars.POSTGRES_URL }}
        run: |
          set -euo pipefail
          base="https://cortex-ai.dengxiao445.workers.dev"

          check_json() {
            local url="$1"
            local expected="$2"
            local tmp
            tmp=$(mktemp)
            status=$(curl -sS --retry 5 --retry-delay 2 --retry-all-errors --max-time 30 -o "$tmp" -w "%{http_code}" "$url")
            echo "GET $url -> HTTP $status"
            head -c 500 "$tmp" || true
            echo
            test "$status" = "$expected"
            rm -f "$tmp"
          }

          check_html() {
            local url="$1"
            local tmp
            tmp=$(mktemp)
            status=$(curl -sS --retry 5 --retry-delay 2 --retry-all-errors --max-time 30 -o "$tmp" -w "%{http_code}" "$url")
            echo "GET $url -> HTTP $status"
            head -c 900 "$tmp" || true
            echo
            test "$status" = "200"
            grep -q "مرکز مدیریت" "$tmp" || grep -q "Cortex AI" "$tmp"
            rm -f "$tmp"
          }

          check_html "$base/control-center"
          check_html "$base/admin"
          check_json "$base/api/admin/auth/me" "401"

          smoke_email="cortex-smoke-${GITHUB_RUN_ID}@example.invalid"
          smoke_password="$(openssl rand -hex 18)"
          smoke_response="$(mktemp)"
          smoke_cookie="$(mktemp)"
          smoke_body="$(jq -nc --arg name "Cortex Smoke" --arg email "$smoke_email" --arg password "$smoke_password" '{name:$name,email:$email,password:$password}')"
          smoke_status="$(curl -sS --retry 5 --retry-delay 2 --retry-all-errors --max-time 60             -H "Content-Type: application/json"             -d "$smoke_body"             -c "$smoke_cookie"             -o "$smoke_response"             -w "%{http_code}"             "$base/api/auth/signup")"
          echo "POST $base/api/auth/signup -> HTTP $smoke_status"
          cat "$smoke_response" | jq . || cat "$smoke_response"
          test "$smoke_status" = "201"
          smoke_user_id="$(jq -r '.user.id // empty' "$smoke_response")"
          test -n "$smoke_user_id"

          session_response="$(mktemp)"
          session_status="$(curl -sS --retry 5 --retry-delay 2 --retry-all-errors --max-time 30             -b "$smoke_cookie"             -o "$session_response"             -w "%{http_code}"             "$base/api/auth/me")"
          echo "GET $base/api/auth/me with smoke cookie -> HTTP $session_status"
          cat "$session_response" | jq . || cat "$session_response"
          test "$session_status" = "200"
          returned_user_id="$(jq -r '.user.id // empty' "$session_response")"
          test "$returned_user_id" = "$smoke_user_id"

          smoke_workspace_id="$(jq -r '.workspaces[0].id // empty' "$session_response")"
          test -n "$smoke_workspace_id"

          check_authed_json() {
            local path="$1"
            local expected="$2"
            local tmp
            tmp="$(mktemp)"
            local status
            status="$(curl -sS --retry 5 --retry-delay 2 --retry-all-errors --max-time 30 -b "$smoke_cookie" -o "$tmp" -w "%{http_code}" "$base$path")"
            echo "GET $base$path -> HTTP $status"
            head -c 800 "$tmp" || true
            echo
            test "$status" = "$expected"
            rm -f "$tmp"
          }

          check_authed_json "/api/workspaces" "200"
          check_authed_json "/api/agents" "200"
          check_authed_json "/api/dashboard?workspaceId=$smoke_workspace_id" "200"
          check_authed_json "/api/site-config" "200"
          check_authed_json "/api/settings/limits?workspaceId=$smoke_workspace_id" "200"
          check_authed_json "/api/providers/status?workspaceId=$smoke_workspace_id" "200"
          check_authed_json "/api/telegram/bots?workspaceId=$smoke_workspace_id" "200"
          check_authed_json "/api/admin/overview?workspaceId=$smoke_workspace_id" "200"
          check_authed_json "/api/admin/analytics?workspaceId=$smoke_workspace_id" "200"

          agent_body="$(jq -nc '{name:"Cortex Smoke Agent",language:"fa",tone:"professional",temperature:0.2,topP:1,maxTokens:256}')"
          agent_response="$(mktemp)"
          agent_status="$(curl -sS --retry 5 --retry-delay 2 --retry-all-errors --max-time 30 -b "$smoke_cookie" -H "Content-Type: application/json" -d "$agent_body" -o "$agent_response" -w "%{http_code}" "$base/api/agents")"
          echo "POST $base/api/agents -> HTTP $agent_status"
          cat "$agent_response" | jq . || cat "$agent_response"
          test "$agent_status" = "201"
          smoke_agent_id="$(jq -r '.agent.id // empty' "$agent_response")"
          test -n "$smoke_agent_id"

          check_authed_json "/api/agents/$smoke_agent_id" "200"
          check_authed_json "/api/agents/$smoke_agent_id/knowledge" "200"
          check_authed_json "/api/agents/$smoke_agent_id/conversations" "200"
          rm -f "$agent_response"

          db_url="${DATABASE_URL:-${POSTGRES_PRISMA_URL:-${POSTGRES_URL:-}}}"
          test -n "$db_url" || { echo "Postgres URL missing for smoke cleanup"; exit 1; }
          [[ "$smoke_user_id" =~ ^[A-Za-z0-9]+$ ]] || { echo "Unexpected smoke user id format"; exit 1; }
          printf 'DELETE FROM "User" WHERE "id" = %s;' "'$smoke_user_id'"             | npx prisma db execute --url "$db_url" --stdin
          rm -f "$smoke_response" "$session_response" "$smoke_cookie"

      - name: Smoke test live Worker
        run: |
          set +e
          tmp=$(mktemp)
          status=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors --max-time 30             -o "$tmp" -w "%{http_code}"             "https://cortex-ai.dengxiao445.workers.dev/api/health")
          cat "$tmp" | jq . || cat "$tmp"
          echo "HTTP status: $status"
          rm -f "$tmp"
          test "$status" = "200"

      - name: Cleanup
        if: always()
        run: rm -f .cf-runtime-secrets
