name: Deploy Cortex AI to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cortex-cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    environment: cortex1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Worker
        run: npx vinext build

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cddba2278fda0cf565b31f9280a7af1f
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing from cortex1 secrets/variables"; exit 1; }
          echo "Cloudflare API token is available; account ID is configured in workflow."

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cddba2278fda0cf565b31f9280a7af1f
        run: npx @vinext/cloudflare deploy --skip-build

      - name: Smoke test live Worker
        run: |
          response=$(curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --max-time 30             "https://cortex-ai.dengxiao445.workers.dev/api/health")
          echo "$response" | jq .
          echo "$response" | jq -e '.ok == true and .database == "connected"'

      - name: Cleanup
        if: always()
        run: rm -f .cf-runtime-secrets
