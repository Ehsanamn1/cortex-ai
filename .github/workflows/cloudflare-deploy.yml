name: Deploy Cortex AI to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    environment: cortex1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Worker
        run: npx vinext build

      - name: Inspect Cloudflare credential wiring
        env:
          SECRET_KEYS: ${{ toJson(secrets) }}
          VARIABLE_KEYS: ${{ toJson(vars) }}
        run: |
          python - <<'PY'
          import json, os
          for label, raw in (("secrets", os.environ.get("SECRET_KEYS", "{}")), ("vars", os.environ.get("VARIABLE_KEYS", "{}"))):
              try:
                  keys = sorted(json.loads(raw).keys())
              except Exception:
                  keys = []
              print(f"{label} keys visible to this job: {keys}")
          PY

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing from cortex1 secrets/variables"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing from cortex1 secrets/variables"; exit 1; }
          echo "Cloudflare credentials are available to this job."

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json
