name: Cortex CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: cortex-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      APP_SECRET_KEY: ci-secret-change-me-012345678901234567890123456789
      APP_ENV: test
      COOKIE_SECURE: false
      LLM_PROVIDER: none
      TELEGRAM_INTERNAL_SECRET: ci-telegram-secret
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run check:vinext
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:vinext
