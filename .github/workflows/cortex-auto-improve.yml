name: Cortex AI Daily Self Improvement

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: cortex-daily-self-improve
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger guarded auto-improvement
        env:
          CORTEX_PUBLIC_URL: ${{ secrets.CORTEX_PUBLIC_URL }}
          CORTEX_AUTO_IMPROVE_SECRET: ${{ secrets.CORTEX_AUTO_IMPROVE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CORTEX_PUBLIC_URL:-}" ] || [ -z "${CORTEX_AUTO_IMPROVE_SECRET:-}" ]; then
            echo "Auto-improvement secrets are not configured; skipping safely."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 5 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${CORTEX_AUTO_IMPROVE_SECRET}" \
            -H "Content-Type: application/json" \
            "${CORTEX_PUBLIC_URL%/}/api/internal/training/auto-improve"
