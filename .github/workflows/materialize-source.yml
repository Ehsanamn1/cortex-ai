name: Materialize Cortex source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: contains(github.event.head_commit.message, 'chore: bootstrap Cortex source archive')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble archive
        run: |
          mkdir -p /tmp/cortex-source
          cat bootstrap/cortex-source.tar.gz.b64.* > /tmp/cortex-source.b64
          base64 -d /tmp/cortex-source.b64 > /tmp/cortex-source.tar.gz

      - name: Materialize source
        run: |
          tar -xzf /tmp/cortex-source.tar.gz -C /tmp/cortex-source
          cp -a /tmp/cortex-source/. .
          rm -rf bootstrap
          rm -f .github/workflows/materialize-source.yml

      - name: Commit materialized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize Cortex AI source" || exit 0
          git push
